<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coba Background</title>
    <style>
      body {
        background-color: lightblue;
        background-image: linear-gradient(to right, rgb(3, 227, 3), rgb(5, 169, 223));
        height: 100vh;
      }

      .kotak1 {
        width: 300px;
        height: 300px;
        background-color: salmon;
        background-image: linear-gradient(to bottom, yellow, salmon);
      }

      .kotak2 {
        width: 300px;
        height: 300px;
        background-color: salmon;
        background-image: radial-gradient(white, pink);
      }

      .kotak3 {
        width: 300px;
        height: 300px;
        background-color: salmon;
        background-image: conic-gradient(cyan, magenta, yellow, red);
      }
    </style>
  </head>

  <body>
    <div class="kotak1"></div>
    <div class="kotak2"></div>
    <div class="kotak3"></div>
  </body>
</html>
