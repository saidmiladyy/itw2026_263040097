<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Quote Galau</title>
    <style>
      @font-face {
        font-family: "Henny Penny";
        src: url(fonts/HennyPenny-Regular.ttf) format(truetype);
      }
      body {
        font-weight: bold;
        color: rgb(253, 253, 253);
        text-align: center;
        background-color: #0f1629;
        background-image: linear-gradient(to bottom, rgb(14 23 42 / 90%), rgb(14 23 42 / 30%)), url("https://picsum.photos/id/10/1000/1000");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        min-height: 100vh;
      }

      h1 {
        font-family: poppins, sans-serif;
        font-size: 4em;
        text-transform: uppercase;
        font-style: italic;
        letter-spacing: 10px;
        /* text-shadow: 5px 5px 0 rgb(215 215 215 / 10%); */
        background-image: linear-gradient(to right, rgb(21, 161, 82) 30%, rgb(255 255 255));
        background-clip: text;
        color: transparent;
        filter: drop-shadow(2px 2px 2px rgb(0 0 0 / 0.4)) drop-shadow(-2px -2px 2px rgb(255 255 255 / 0.4));
      }

      .quote {
        font-family: "Courier New", Courier, monospace;
        font-size: 22px;
        line-height: 2.2;
        word-spacing: 5px;
        background-color: rgb(255 255 255 / 5%);
        max-width: 1000px;
        margin: auto;
        padding: 20px;
        border-radius: 30px;
        border: 1px solid rgb(255 255 255 / 10%);
        box-shadow: 0 10px 25px rgb(0 0 0 / 50%);
      }

      span {
        color: rgb(174, 15, 15);
        text-decoration: none;
        text-shadow: 2px 2px 0 rgb(0 0 0 / 50%);
      }

      .credit {
        font-size: 12px;
        letter-spacing: 2px;
        color: rgb(226, 222, 222);
        font-weight: normal;
        text-transform: uppercase;
        border-top: 1px solid rgb(255 255 255 / 20%);
        width: 50%;
        margin: 20px auto;
        padding-top: 10px;
      }
    </style>
  </head>

  <body>
    <h1>JANGAN MENYERAH</h1>

    <p class="quote">"Kamu tidak bisa <span>kembali</span> dan mengubah awal saat kamu memulainya, <br />tapi kamu bisa memulainya lagi dari mana kamu berada sekarang dan ubah akhirnya."</p>

    <p class="credit">— C.S Lewis</p>
  </body>
</html>
