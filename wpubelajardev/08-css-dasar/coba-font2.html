<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coba CSS 4 - Font Styling</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=BBH+Hegarty&family=Bebas+Neue&family=Bungee&family=Henny+Penny&family=Michroma&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap");

      @font-face {
        font-family: "Henny Panny";
        src: url(fonts/HennyPenny-Regular.ttf) format(truetype);
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      h1 {
        color: brown;
        font-family: "Bebas Neue", system-ui;
      }
      p {
        color: darkblue;
      }
      .font-henny {
        font-family: "Henny Panny";
      }
    </style>
  </head>
  <body>
    <h1>Hellow World</h1>
    <p class="font-henny">Lorem ipsum dolor sit amet consectetur adipisicing elit. Tenetur?</p>
    <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Officiis, distinctio!</p>
  </body>
</html>
