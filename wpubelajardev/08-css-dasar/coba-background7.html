<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>multiple Background</title>
    <style>
      body {
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background-color: #363636;
      }
      .frame {
        width: 400px;
        height: 400px;
        border: 10px solid white;
        margin: auto;
        background-image: url(img/omen.png), url(img/nyengir.png), url(img/pheoix.png);
        background-size: 300px, 200px, 200px;
        background-repeat: no-repeat, no-repeat, no-repeat;
        background-position:
          bottom left,
          center top,
          bottom right;
        border-radius: 50%;
      }
      h1 {
        color: #fff;
        text-align: center;
        font-family: "Times New Roman", Times, serif;
        font-size: 40px;
        text-shadow: 2px 2px 4px black;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <h1>my profil card</h1>
    <div class="frame"></div>
  </body>
</html>
