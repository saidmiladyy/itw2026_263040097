<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Quote Galau</title>
    <style>
      @font-face {
        font-family: "Henny Penny";
        src: url(fonts/HennyPenny-Regular.ttf) format(truetype);
      }
      body {
        font-weight: bold;
        color: rgb(253, 253, 253);
        text-align: center;
        background-color: #0f1629;
      }

      h1 {
        font-family: "Henny Penny", sans-serif;
        font-size: 48px;
        text-transform: uppercase;
        font-style: italic;
        letter-spacing: 10px;
        text-decoration: underline;
        text-decoration-style: wavy;
        text-decoration-color: rgb(100, 100, 100);
        text-shadow: 5px 5px 0 rgb(215 215 215 / 10%);
      }

      .quote {
        font-family: "Courier New", Courier, monospace;
        font-size: 22px;
        line-height: 2.2;
        word-spacing: 5px;
      }

      span {
        color: rgb(181, 181, 181);
        text-decoration: line-through;
      }

      .credit {
        font-size: 12px;
        letter-spacing: 2px;
        color: rgb(151, 151, 151);
        font-weight: normal;
      }
    </style>
  </head>

  <body>
    <h1>Abraham Lincoln Quotes</h1>

    <p class="quote">"Cara terbaik untuk <span>meramalkan</span> masa depan ialah dengan cara menciptakannya.</p>

    <p class="credit">— Abraham Lincoln</p>
  </body>
</html>
