<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coba select dan Textarea</title>
  </head>
  <body>
    <h1>Contoh Select dan Textarea</h1>
    <form>
      <label for="country">Pilih Negara:</label><br />
      <select id="country" name="country" required>
        <option value="">--Pilih Negara--</option>
        <option value="indonesia">Indonesia</option>
        <option value="malaysia">Malaysia</option>
        <option value="singapura">Singapura</option>
        <option value="thailand">Thailand</option></select
      ><br /><br />

      <label for="bio">Bio:</label><br />
      <textarea id="bio" name="bio" rows="10" cols="50" placeholder="Tulis bio Anda di sini..." required></textarea><br /><br />

      <input type="submit" value="Submit" />
    </form>
  </body>
</html>
