<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sneakers Card</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Poppins", sans-serif;
        background-color: #f5f5f5;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .product-card {
        background-color: #fff;
        width: 330px;
        margin: 0 auto;
        border-radius: 16px;
        padding: 24px;
        border: 1px solid #e0e0e0;
        box-shadow: 0 10px 20px rgb(0 0 0 / 0.1);
      }

      .product-image {
        width: 100%;
        height: 220px;
        overflow: hidden;
        border-radius: 12px;
        margin-bottom: 20px;
      }

      .product-image img {
        width: 100%;
        height: 100%;
        object-fit: fill;
      }

      .product-category {
        font-size: 12px;
        color: rgb(208, 102, 8);
        text-transform: uppercase;
        letter-spacing: 1.5px;
        font-weight: bold;
        margin-bottom: 8px;
      }
      .product-title {
        font-size: 22px;
        font-weight: bold;
        color: #000000;
        margin-bottom: 12px;
      }

      .product-description {
        font-size: 14px;
        color: #666666;
        margin-bottom: 16px;
      }

      .price-section {
        display: flex;
        align-items: center;
        margin-bottom: 20px;
      }
      .price {
        font-size: 18px;
        font-weight: bold;
        color: #000000;
        margin-right: 10px;
      }
      .original-price {
        font-size: 14px;
        color: #999999;
        text-decoration: line-through;
      }

      .size-options-wrapper {
        margin-bottom: 20px;
        border: none;
      }

      .size-label-text {
        font-size: 14px;
        font-weight: bold;
        color: #000000;
        margin-bottom: 13px;
      }

      .size-options {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }

      .size-options input[type="radio"] {
        display: none;
      }

      .size-options label {
        display: inline-block;
        padding: 8px 12px;
        border: 1px solid #ccc;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .size-options input[type="radio"]:checked + label {
        background-color: #000000;
        color: #ffffff;
        border-color: #000000;
      }

      .size-options label:hover {
        background-color: #f0f0f0;
      }

      .buy-button {
        display: block;
        width: 100%;
        padding: 12px;
        background-color: #000000;
        color: #ffffff;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .buy-button:hover {
        background-color: #fffefe;
        color: #000000;
      }
    </style>
  </head>
  <body>
    <article class="product-card">
      <figure class="product-image">
        <img src="https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?q=80&w=1025&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="Sneakers Nike Red" />
      </figure>

      <p class="product-category">Nike Sportswear</p>
      <h3 class="product-title">Nike Air Max 270 React</h3>

      <p class="product-description">The Nike Air Max 270 React combines a full-length foam midsole with a large-volume Max Air unit for cushioning that feels as good as it looks.</p>

      <div class="price-section">
        <span class="price">IDR 2.299.000</span>
        <del class="original-price">IDR 3.499.000</del>
      </div>

      <form action="">
        <fieldset class="size-options-wrapper">
          <legend class="size-label-text">Pilih Ukuran (US):</legend>
          <div class="size-options">
            <input type="radio" name="size" id="s8" value="8" />
            <label for="s8">8</label>

            <input type="radio" name="size" id="s9" value="9" />
            <label for="s9">9</label>

            <input type="radio" name="size" id="s10" value="10" />
            <label for="s10">10</label>

            <input type="radio" name="size" id="s11" value="11" />
            <label for="s11">11</label>

            <input type="radio" name="size" id="s12" value="12" />
            <label for="s12">12</label>
          </div>
        </fieldset>

        <button type="submit" class="buy-button">Buy Now</button>
      </form>
    </article>
  </body>
</html>
